<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إنشاء حساب | Nexora</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="hero">

<h1>إنشاء حساب</h1>

<form method="POST">

<input
type="text"
name="username"
placeholder="اسم المستخدم"
required>

<input
type="email"
name="email"
placeholder="البريد الإلكتروني"
required>

<input
type="password"
name="password"
placeholder="كلمة المرور"
required>

<div class="buttons">

<button
type="submit"
class="btn upload">

إنشاء الحساب

</button>

<a
href="{{ url_for('login') }}"
class="btn import">

لدي حساب

</a>

</div>

</form>

</div>

</body>

</html>
